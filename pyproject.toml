[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Pulkit_Model_Evaluation"  # <--- MUST BE UNIQUE ON PYPI
version = "1.0.0"
authors = [
  { name="Pulkit Goyal", email="pulkit1008goyal@gmail.com" },
]
description = "A Python 3.10 compatible CLI tool for TOPSIS method"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "numpy"
]

[project.scripts]
topsis = "topsis_pckg.topsis:main"